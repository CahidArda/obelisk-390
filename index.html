<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2ecdf">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dikilitaş</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2ecdf;--ink:#2b2420;--muted:#7a6d61;--hair:rgba(43,36,32,.22);--glyph:#5a2c20;--hl:rgba(238,192,70,.28)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:"EB Garamond","Noto Serif JP",Georgia,serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.frame{position:fixed;inset:7px;border:1px solid var(--ink);pointer-events:none;z-index:9}
.frame::after{content:"";position:absolute;inset:3px;border:.5px solid var(--hair)}
#app{position:fixed;inset:0;display:flex}
#model{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.plate{text-align:center;padding:calc(env(safe-area-inset-top) + 26px) 24px 0}
.plate h1{font-weight:500;font-size:15px;letter-spacing:.26em;text-transform:uppercase}
.plate .maker{font-style:italic;font-size:15.5px;margin-top:3px}
.plate .no{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:3px;color:var(--muted)}
.plate .r{width:110px;height:.5px;background:var(--ink);opacity:.5;margin:8px auto 0}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.pt{cursor:pointer}
.cap{text-align:center;pointer-events:none;padding-top:6px}
.cap .f{font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.cap .h{font-style:italic;font-size:13.5px;color:var(--muted);margin-top:1px;transition:opacity .6s}
.zb{position:absolute;top:6px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb button{width:34px;height:34px;border:1px solid var(--ink);background:var(--paper);font-size:17px;line-height:1}
.zb button:disabled{opacity:.3;cursor:default}
#fit{display:none;font-size:15px}
#fit.show{display:block}
#card{position:relative;margin:6px 16px 0;background:var(--paper);border:1px solid var(--ink);padding:9px 40px 10px 14px;display:none}
body.carded .cap{display:none}
body.carded .specs{display:none}
.info{flex:none}
@media (max-width:959px){
  .info{height:140px;position:relative;z-index:4}
  .info .cap,.info .specs{overflow:hidden}
  /* the card sits at the bottom of the slot and grows upward over the model, so long labels show in full without moving the model */
  #card{position:absolute;left:16px;right:16px;bottom:8px;margin:0;max-height:min(60vh,calc(100dvh - 120px));overflow-y:auto;box-shadow:0 -4px 0 var(--paper),3px 3px 0 rgba(43,36,32,.1)}
}
@media (max-width:959px) and (max-height:640px){.info{height:118px}}
#card.show{display:block}
#card .ref{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#card .t{font-size:18px;font-weight:500;line-height:1.25;margin-top:2px}
#card .tr{font-style:italic;color:var(--muted);font-size:14.5px;margin-top:2px}
#card .tr:empty{display:none}
#card .more{margin-top:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-bottom:.5px solid var(--ink);padding:2px 0}
#card .x{position:absolute;top:6px;right:6px;width:30px;height:30px;font-size:14px;color:var(--muted)}
@media (min-width:960px){#card{display:none!important}}
#tip{position:absolute;pointer-events:none;max-width:min(260px,calc(100% - 20px));background:var(--paper);border:1px solid var(--ink);padding:7px 10px 8px;font-size:15.5px;line-height:1.3;max-width:260px;opacity:0;transition:opacity .15s;box-shadow:3px 3px 0 rgba(43,36,32,.1);z-index:3}
#tip.show{opacity:1}
#tip small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.specs{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;padding:10px 28px 0;max-width:520px;margin:0 auto;width:100%}
.specs div{display:flex;justify-content:space-between;gap:10px;border-top:.5px solid var(--hair);padding:3px 0 2px;font-size:12px;line-height:1.35}
.specs .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:2px;white-space:nowrap}
.specs .v{text-align:right}
.toggle{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);display:flex;border:1px solid var(--ink);background:var(--paper);z-index:10}
.toggle button{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;padding:10px 20px;white-space:nowrap}
.toggle button.on{background:var(--ink);color:var(--paper)}
.lang{position:fixed;top:calc(env(safe-area-inset-top) + 15px);left:16px;z-index:11;display:flex;align-items:center}
.lang>button{font-size:11px;letter-spacing:.16em;padding:6px 8px;color:var(--muted);display:flex;align-items:center;gap:5px}
.lang>button:hover{color:var(--ink)}
.lang .menu{display:none;position:absolute;top:100%;left:4px;background:var(--paper);border:1px solid var(--ink);box-shadow:3px 3px 0 rgba(43,36,32,.1);min-width:120px}
.lang.open .menu{display:block}
.lang .menu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:15px}
.lang .menu button.on{background:var(--hl)}
#aboutBtn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 8px;color:var(--muted);display:flex;align-items:center;gap:5px}
#aboutBtn:hover{color:var(--ink)}
.about{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);background:rgba(43,36,32,.28)}
.about.open{display:flex}
.about .box{position:relative;width:100%;max-width:540px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border:1px solid var(--ink);box-shadow:5px 5px 0 rgba(43,36,32,.12);padding:28px 30px 24px}
.about .box::before{content:"";position:absolute;inset:3px;border:.5px solid var(--hair);pointer-events:none}
.about .x{position:absolute;top:10px;right:12px;width:30px;height:30px;font-size:15px;color:var(--muted)}
.about .x:hover{color:var(--ink)}
.about .n{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.about h2{font-weight:500;font-size:25px;margin-top:4px}
.about .sub{font-style:italic;font-size:15.5px;color:var(--muted);margin-top:2px;text-transform:none;letter-spacing:0}
.about .r{width:90px;height:.5px;background:var(--ink);opacity:.5;margin:14px 0}
.about p{font-size:16.5px;line-height:1.45;margin-top:10px}
.about a{color:var(--glyph);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:3px}
.about ul{list-style:none;margin-top:10px}
.about li{font-size:16.5px;line-height:1.45;padding-left:16px;position:relative}
.about li::before{content:"\00B7";position:absolute;left:3px;color:var(--muted);font-weight:600}
.about .src p{font-size:14px;color:var(--muted);line-height:1.45}
.lang>button .mi{display:none}
.lang .menu .ab{display:none;align-items:center;gap:7px;border-top:.5px solid var(--hair);color:var(--muted)}
@media (max-width:600px){.about .box{padding:24px 20px 20px}.about h2{font-size:22px}#aboutBtn{display:none}.lang>button .g,.lang>button .lc{display:none}.lang>button .mi{display:block}.lang .menu .ab{display:flex}}
/* reading panel */
#read{position:fixed;inset:0;z-index:5;background:var(--paper);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
body.reading #read{opacity:1;visibility:visible}
#rs{position:absolute;inset:11px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(43,36,32,.28) transparent}
#rs::-webkit-scrollbar{width:9px}
#rs::-webkit-scrollbar-track{background:transparent}
#rs::-webkit-scrollbar-thumb{background:rgba(43,36,32,.22);border-radius:9px;border:3px solid var(--paper)}
#rs::-webkit-scrollbar-thumb:hover{background:rgba(43,36,32,.4)}
.tabs{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:center;gap:2px;padding:calc(env(safe-area-inset-top) + 9px) 14px 0;border-bottom:.5px solid var(--hair)}
.tabs button{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px;border-bottom:1.5px solid transparent;margin-bottom:-.5px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.face{padding:30px 0 6px}
.face>header{text-align:center;margin-bottom:16px;padding:0 18px}
.face>header .n{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.face>header h2{font-weight:400;font-style:italic;font-size:24px;margin-top:2px}
.face>header .r{width:80px;height:.5px;background:var(--ink);opacity:.5;margin:10px auto 0}
.pad{padding-left:max(18px,calc((100% - 620px)/2));padding-right:max(18px,calc((100% - 620px)/2))}
.p{display:grid;grid-template-columns:76px 1fr;gap:14px;padding-top:16px;padding-bottom:14px;border-top:.5px solid var(--hair);transition:background .25s;scroll-margin-top:60px}
.p.on{background:var(--hl)}
.p.ps{display:block}
.col{display:flex;flex-direction:column;align-items:center;font-family:"Noto Sans Egyptian Hieroglyphs";font-size:31px;line-height:1.12;color:var(--glyph);padding-top:2px}
.col .row{white-space:nowrap;text-align:center}
.col .row.f{font-size:26px;line-height:.85}
.col.scene{flex-direction:row;font-size:24px;gap:1px;justify-content:center}
.cart{border:1.5px solid currentColor;border-radius:999px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;position:relative;margin-bottom:8px}
.cart::after{content:"";position:absolute;bottom:-7px;left:-5px;right:-5px;height:2px;background:currentColor}
.serekh{border:1.5px solid currentColor;padding:7px 5px 0;display:flex;flex-direction:column;align-items:center}
.serekh .fac{height:15px;align-self:stretch;margin:6px -5px 0;border-top:1.5px solid currentColor;background:repeating-linear-gradient(90deg,currentColor 0 1.5px,transparent 1.5px 7px)}
.txt .ref{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.txt h3{font-weight:500;font-size:20.5px;line-height:1.26;margin-top:2px}
.txt .tr{font-style:italic;color:var(--muted);font-size:15.5px;margin-top:3px}
.txt .note{font-size:15.5px;line-height:1.5;margin-top:7px;color:#463c35}
html[lang=ja] .txt h3{font-size:18.5px;line-height:1.45}
html[lang=ja] .txt .note{font-size:14.5px;line-height:1.7}
.see{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:3px 0;transition:color .15s}
.see:hover{color:var(--ink)}
.see svg{flex:none}
.break{text-align:center;font-style:italic;color:var(--muted);font-size:15px;padding-top:16px;padding-bottom:4px;border-top:.5px dashed var(--ink)}
.intro{font-size:16px;line-height:1.55;margin-bottom:12px}
.sidehd{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-top:26px;padding-top:12px;padding-bottom:2px;border-top:.5px solid var(--hair)}
.sidehd + .p{padding-top:6px}
.sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:16px;padding-top:8px;border-top:.5px dotted var(--hair)}
.eng{display:block;width:100%;margin:10px 0 8px}
.ph{margin:0 0 10px}
.ph img{display:block;width:100%;height:auto;border:.5px solid var(--hair)}
.ph figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.ph a{color:inherit}
.orig{font-size:13px;letter-spacing:.1em;line-height:1.75;text-align:center;margin:10px 0;color:#4a3f37}
.insen{font-size:17px;line-height:1.5;font-style:italic;margin-top:4px}
html[lang=ja] .insen{font-style:normal;font-size:15.5px;line-height:1.8}
.foot{margin-top:26px;padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 110px);border-top:.5px solid var(--ink);font-size:14px;line-height:1.55;color:var(--muted)}
.foot p+p{margin-top:8px}
#loader{position:fixed;inset:0;display:grid;place-items:center;font-style:italic;color:var(--muted);z-index:8;background:var(--paper);transition:opacity .4s}
@media (min-width:960px){
  #model{padding-bottom:22px}
  #read{position:relative;inset:auto;flex:none;width:min(46%,660px);opacity:1;visibility:visible;border-left:1px solid var(--ink);margin:7px 7px 7px 0}
  #rs{inset:4px 4px 4px 0}
  .tabs{padding-top:22px}
  .toggle{display:none}
  .foot{padding-bottom:40px}
  .plate{padding-top:34px}.plate h1{font-size:17px}
  .lang{top:20px;left:20px}
}
@media (max-height:640px){.specs{display:none}}
</style>

<script src="i18n.js"></script>

<body>
<div class="frame"></div>
<div id="loader">…</div>
<div class="lang" id="lang"><button id="langBtn" aria-haspopup="true"></button><div class="menu" id="langMenu"></div><button id="aboutBtn" aria-haspopup="dialog"></button></div>
<div class="about" id="about" role="dialog" aria-modal="true" aria-labelledby="aboutT"><div class="box" id="aboutBox"></div></div>
<div id="app">
  <section id="model">
    <div class="plate">
      <h1>Dikilitaş</h1>
      <div class="maker" id="maker"></div>
      <div class="no" id="reerected"></div>
      <div class="r"></div>
    </div>
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="zb"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="fit">⤢</button></div>
      <div id="tip"></div>
    </div>
    <div class="info">
    <div class="cap"><div class="f" id="faceCap"></div><div class="h" id="hint"></div></div>
      <div id="card"><button class="x" aria-label="Close">✕</button><div class="ref"></div><div class="t"></div><div class="tr"></div><button class="more"></button></div>
    <div class="specs" id="specs"></div>
    </div>
  </section>
  <section id="read"><div id="rs">
    <nav class="tabs" id="tabs"></nav>
    <div id="readBody"></div>
  </div></section>
</div>
<div class="toggle"><button data-m="model" class="on"></button><button data-m="read"></button></div>

<script type="module">
import * as THREE from 'three';
const D = window.OBELISK, I = window.I18N, $ = s => document.querySelector(s);
const HF = '"Noto Sans Egyptian Hieroglyphs"';
const wideMQ = matchMedia('(min-width: 960px)');
const isWide = () => wideMQ.matches;
const touch = matchMedia('(hover: none)').matches;
const R = ['I','II','III','IV'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- language ---------- */
let lang = (() => {
  try { const s = localStorage.getItem('obelisk-lang'); if (s && I.ui[s]) return s; } catch {}
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return I.ui[n] ? n : 'en';
})();
const U = k => I.ui[lang][k] ?? I.ui.en[k];
const L = s => lang === 'en' ? s : (I.t[lang]?.[s] ?? s);
$('#loader').textContent = U('loading');

await Promise.race([
  Promise.all([
    document.fonts.load('64px ' + HF, '\u{13143}\u{1302D}\u{131F3}'),
    document.fonts.load('500 20px "EB Garamond"', 'AΑΚ'),
    document.fonts.load('italic 20px "EB Garamond"', 'A'),
  ]),
  new Promise(r => setTimeout(r, 6000)),
]).catch(() => {});

/* ---------- pedestal sides (index matches obelisk face direction: 0 +z, 1 +x, 2 -z, 3 -x) ---------- */
const latin = D.base.find(b => b.kind === 'latin'), greek = D.base.find(b => b.kind === 'greek');
const SIDES = [
  { k: 'south', up: { t: 'Theodosius and the imperial family', d: 'The emperor sits with the imperial family in the box, flanked by guards. Below: spectators and soldiers.' },
    lo: { t: 'The Hippodrome during the games', d: 'A chariot race around the spina, the central barrier on which this obelisk stood.' } },
  { k: 'east', up: { t: 'Theodosius offers the victor’s wreath', d: 'In the imperial box the emperor holds out the laurel wreath for the winner of the races. Below: spectators, musicians and dancers, with a water organ.' },
    lo: { ins: latin, key: 'latin' } },
  { k: 'north', up: { t: 'Theodosius and his court', d: 'The emperor stands with his court and guards, holding the labarum, the Chi-Rho standard. Below: spectators of the races. A later vertical channel cuts through this side.' },
    lo: { t: 'Transport and raising of the obelisk', d: 'The obelisk being moved and hauled upright: one of the few ancient depictions of how such a monolith was raised.' } },
  { k: 'west', up: { t: 'Submission of the barbarians', d: 'Kneeling foreigners bring tribute to the emperor and his co-emperors in the imperial box.' },
    lo: { ins: greek, key: 'greek' } },
];

/* ---------- shared glyph layout ---------- */
function rowsFor(glyphs){
  const rows = [];
  for (let i = 0; i < glyphs.length; i++){
    const [ch, k] = glyphs[i], nx = glyphs[i+1];
    if (k !== 'f' && nx && nx[1] !== 'f'){ rows.push({ chars: [ch, nx[0]], h: 1, wide: k === 'w' || nx[1] === 'w' }); i++; }
    else rows.push({ chars: [ch], h: k === 'f' ? .58 : 1 });
  }
  return rows;
}

/* ---------- static UI text ---------- */
const toggleBtns = [...document.querySelectorAll('.toggle button')];
function applyUI(){
  document.documentElement.lang = lang;
  $('#maker').textContent = U('maker');
  $('#reerected').textContent = U('reerected');
  $('#hint').textContent = touch ? U('hintTouch') : U('hintMouse');
  $('#fit').title = $('#fit').ariaLabel = U('fit');
  toggleBtns[0].textContent = U('model'); toggleBtns[1].textContent = U('read');
  $('#specs').innerHTML = [['material','graniteV'],['height',null,'18.5 m'],['original','origV'],['withBase',null,'25.6 m'],['carved','carvedV'],['raised','raisedV']]
    .map(([k, v, raw]) => `<div><span class="k">${U(k)}</span><span class="v">${raw || U(v)}</span></div>`).join('');
  const cur = I.langs.find(l => l[0] === lang);
  $('#langBtn').innerHTML = `<svg class="g" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lc">${cur[1]}</span><svg class="mi" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.4"/></svg>`;
  $('#langBtn').ariaLabel = U('lang');
  $('#aboutBtn').innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 10.5v6.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.4" r="1.1" fill="currentColor"/></svg><span>${U('about')}</span>`;
  $('#aboutBtn').ariaLabel = U('about');
  $('#aboutBox').innerHTML = `<button class="x" aria-label="${U('close')}">✕</button>
    <div class="n">${U('about')}</div><h2 id="aboutT">Dikilitaş</h2>
    <div class="sub">${U('maker')} · ${U('reerected')}</div><div class="r"></div>
    <p>${U('aboutMade').replace('<a>', '<a href="https://cahidarda.github.io" target="_blank" rel="noopener">')}</p>
    <ul><li><a href="https://cahidarda.github.io/articles/dikilitas" target="_blank" rel="noopener">${U('aboutBlog')}</a></li>
    <li><a href="https://github.com/CahidArda/obelisk-390" target="_blank" rel="noopener">${U('aboutCode')}</a></li></ul>
    <div class="r"></div>

geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
const obMats = [];
for (let i = 0; i < 4; i++){ const m = tmat({ map: faces[i].tex }, normals[i]); m.userData.base = new THREE.Color(1,1,1); obMats.push(m); }
for (let i = 0; i < 4; i++) obMats.push(tmat({ color: GRANITE }, normals[4 + i]));
const obelisk = new THREE.Mesh(geo, obMats); pivot.add(obelisk);
pivot.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), inkLine));
const cubeMats = BN.map(n => tmat({ color: '#56705f' }, n));
const cubes = corners.map(([sx, sz]) => box(.55, CUBE, .55, sx * (WB - .3), PED_TOP, sz * (WB - .3), cubeMats, 'cube'));
const pickables = [obelisk, upper, lower, arc, ...pors, ...cubes];

/* ---------- camera / view state ---------- */
let yaw = .5, tilt = .2, zoom = 1, ty = TOP / 2 - .4, vel = 0, anim = null, auto = true;
const Lcam = new THREE.Vector3(-.55, .5, 1).normalize(), Lw = new THREE.Vector3(), nW = new THREE.Vector3();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const viewH = () => TOP * 1.1 / zoom;
const HOME_Y = TOP / 2 - .4, PED_Y = 2.6;
// zoom/pan are eased toward targets; an anchor keeps the point under the cursor/pinch fixed while zooming
let zoomT = 1, tyT = HOME_Y, anchor = null, tiltT = null;
const FULL = TOP * 1.1, C_LO = HOME_Y - FULL / 2, C_HI = HOME_Y + FULL / 2;
const tyBounds = z => { const vh = FULL / z; return [C_LO + vh / 2 - .6 * (1 - 1 / z), C_HI - vh / 2 + .6 * (1 - 1 / z)]; };
const clampTy = (y, z) => { const [a, b] = tyBounds(z); return clamp(y, a, b); };
function place(){
  const w = stage.clientWidth, h = stage.clientHeight, vh = viewH(), a = w / h;
  cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  cam.position.set(0, ty + Math.sin(tilt) * 60, Math.cos(tilt) * 60); cam.lookAt(0, ty, 0);
  pivot.rotation.y = yaw;
  pivot.updateMatrixWorld(); cam.updateMatrixWorld();
  Lw.copy(Lcam).applyQuaternion(cam.quaternion);
  for (const m of tinted){
    nW.copy(m.userData.n).applyQuaternion(pivot.quaternion);
    m.color.copy(m.userData.base).multiplyScalar(.7 + .36 * Math.max(0, nW.dot(Lw)));
  }
}
function resize(){ renderer.setSize(stage.clientWidth, stage.clientHeight, false); if (typeof place === 'function' && pivot.children.length){ place(); renderer.render(scene, cam); } }
new ResizeObserver(resize).observe(stage); resize();
const frontFace = () => (((Math.round(-yaw / (Math.PI / 2))) % 4) + 4) % 4;
function stopAuto(){ auto = false; $('#hint').style.opacity = 0; }
function goTo(f, z = null, y = null){
  let t = -f * Math.PI / 2;
  while (t - yaw > Math.PI) t -= 2 * Math.PI;
  while (t - yaw < -Math.PI) t += 2 * Math.PI;
  vel = 0; anim = { yaw: t };
  if (z != null){ zoomT = z; anchor = null; }
  if (y != null){ tyT = y; anchor = null; }
}
const passageY = (f, s) => { const S = faces[f].segs[s], yt = (S.y0 + S.y1) / 2; return Y0 + H * (1 - yt / TH); };

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy){
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  const h = ray.intersectObjects(pickables, false)[0];
  if (!h) return null;
  const o = h.object, mi = h.face.materialIndex;
  if (o === obelisk){
    if (mi >= 4) return { k: U('pyrT'), en: U('pyrD') };
    const F = faces[mi], yt = (1 - h.uv.y) * TH;
    const s = F.segs.findIndex(S => yt >= S.h0 && yt < S.h1);
    if (s < 0) return { k: `${U('face')} ${R[mi]}`, en: U('brkTip') };
    return { f: mi, s, k: `${U('face')} ${R[mi]} · ${R[mi]}.${s + 1}`, en: L(F.segs[s].en) };
  }
  const info = o.userData.info;
  if (info === 'cube') return { k: U('cubesT'), en: U('cubesD') };
  if (info === 'por') return { k: U('porT'), en: U('porD') };
  if (info === 'arc') return { k: U('arcT'), en: U('arcD') };
  const side = SIDE_OF_MAT[mi];
  if (side == null) return null;
  const S = SIDES[side];
  if (info === 'upper') return { slot: side * 2, k: `${U(S.k)} · ${U('upper')}`, en: L(S.up.t) };
  return { slot: side * 2 + 1, k: `${U(S.k)} · ${U('lower')}`, en: S.lo.ins ? U(S.lo.key) : L(S.lo.t) };
}

/* ---------- active item, shared by both views ---------- */
let act = { f: -1, s: -1, side: -1 }, region = 'ob';
const rs = $('#rs');
function highlightModel(f, s, slot = -1){ faces.forEach((F, i) => paint(F, i === f ? s : -1)); for (const k in PED) paintPed(PED[k], +k === slot); }
function restoreActiveClass(){
  arts.forEach(a => a.classList.toggle('on', a.dataset.slot != null ? +a.dataset.slot === act.side : (+a.dataset.f === act.f && +a.dataset.s === act.s)));
}
function setActive(f, s, side, src){
  if (act.f === f && act.s === s && act.side === side) return;
  act = { f, s, side };
  restoreActiveClass();
  highlightModel(f, s, side);
  updateCard();
  if ((src === 'read' || src === 'hover') && isWide()){
    stopAuto();
    if (side >= 0){ if (region !== 'ped' || frontFace() !== side >> 1){ goTo(side >> 1, 2.6, PED_Y); region = 'ped'; } }
    else if (f >= 0){
      if (region === 'ped'){ goTo(f, 1, HOME_Y); region = 'ob'; }
      else {
        if (frontFace() !== f) goTo(f);
        // zoomed in (pinch, wheel or buttons): keep the passage being read in view
        if (zoomT > 1.05){ tyT = clampTy(passageY(f, s), zoomT); anchor = null; }
      }
    }
  }
}
// programmatic scrolls must not re-select whatever lands under the trigger line
let progScroll = false, progTimer = 0;
const armIdle = ms => { clearTimeout(progTimer); progTimer = setTimeout(() => progScroll = false, ms); };
function scrollToEl(el, smooth){
  if (!el) return;
  if (el.previousElementSibling?.classList.contains('sidehd')) el = el.previousElementSibling;
  progScroll = true; armIdle(400);
  rs.scrollTo({ top: el.offsetTop - 56, behavior: smooth ? 'smooth' : 'auto' });
}

const card = $('#card');
function updateCard(){
  const { f, s, side } = act;
  const on = !(f < 0 && side < 0) && !isWide();
  document.body.classList.toggle('carded', on);
  if (!on){ card.classList.remove('show'); return; }
  if (f >= 0){
    const S = faces[f].segs[s];
    card.querySelector('.ref').textContent = `${U('face')} ${R[f]} \u00b7 ${R[f]}.${s + 1}`;
    card.querySelector('.t').textContent = L(S.en);
    card.querySelector('.tr').textContent = S.tr || '';
  } else {
    const S = SIDES[side >> 1], lo = side & 1;
    card.querySelector('.ref').textContent = `${U(S.k)} \u00b7 ${U(lo ? 'lower' : 'upper')}`;
    card.querySelector('.t').textContent = lo ? (S.lo.ins ? U(S.lo.key) : L(S.lo.t)) : L(S.up.t);
    card.querySelector('.tr').textContent = '';
  }
  card.querySelector('.more').textContent = `${U('read')} \u2192`;
  card.classList.add('show');
}
card.querySelector('.x').onclick = () => setActive(-1, -1, -1, 'model');
card.querySelector('.more').onclick = () => {
  const el = act.f >= 0 ? document.getElementById(`p${act.f}-${act.s}`) : document.getElementById(`ps${act.side}`);
  setMode('read'); requestAnimationFrame(() => scrollToEl(el, false));
};

/* ---------- mode switch (mobile) ---------- */
function setMode(m){
  document.body.classList.toggle('reading', m === 'read');
  toggleBtns.forEach(b => b.classList.toggle('on', b.dataset.m === m));
  stopAuto();
  if (m === 'model'){
    if (act.side >= 0) goTo(act.side >> 1, 2.6, PED_Y);
    else if (act.f >= 0 && frontFace() !== act.f) goTo(act.f);
  }
}
toggleBtns.forEach(b => b.onclick = () => setMode(b.dataset.m));
function openPassage(f, s){
  setActive(f, s, -1, 'model');
  if (!isWide()) setMode('read');
  requestAnimationFrame(() => scrollToEl(document.getElementById(`p${f}-${s}`), isWide()));
}
function openSide(i){
  setActive(-1, -1, i, 'model');
  if (!isWide()) setMode('read');
  requestAnimationFrame(() => scrollToEl(document.getElementById(`ps${i}`), isWide()));
}

/* ---------- read view: tabs, scroll, hover, eye buttons ---------- */
let readTouched = false, mouseY = null;
const touchRead = () => { if (!readTouched){ readTouched = true; stopAuto(); } };
['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(ev => rs.addEventListener(ev, touchRead, { passive: true }));
rs.addEventListener('mousemove', e => { mouseY = e.clientY; });
rs.addEventListener('mouseleave', () => { mouseY = null; });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  touchRead();
  const el = document.getElementById(b.dataset.t);
  if (b.dataset.f != null) setActive(+b.dataset.f, 0, -1, 'read');
  else setActive(-1, -1, 0, 'read');
  scrollToEl(el, true);
});
$('#readBody').addEventListener('click', e => {
  const b = e.target.closest('.see'); if (!b) return;
  stopAuto();
  if (!isWide()) setMode('model');
  if (b.dataset.slot != null){ const i = +b.dataset.slot; setActive(-1, -1, i, 'loc'); region = 'ped'; goTo(i >> 1, 2.6, PED_Y); }
  else { const f = +b.dataset.f, s = +b.dataset.s; setActive(f, s, -1, 'loc'); region = 'ob'; goTo(f, 2.8, passageY(f, s)); }
});
$('#readBody').addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse' || progScroll) return;
  const a = e.target.closest('.p'); if (!a) return;
  touchRead();
  if (a.dataset.slot != null) setActive(-1, -1, +a.dataset.slot, 'hover');
  else setActive(+a.dataset.f, +a.dataset.s, -1, 'hover');
});
let scrollRaf = 0;
rs.addEventListener('scroll', () => {
  if (progScroll) armIdle(180);
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => {
    const r = rs.getBoundingClientRect();
    const secs = ['face0','face1','face2','face3','ped'].map(id => document.getElementById(id));
    let on = 0; secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= r.top + 90) on = i; });
    document.querySelectorAll('.tabs button').forEach((b, i) => b.classList.toggle('on', i === on));
    if (progScroll || !readTouched) return;
    if (!isWide() && !document.body.classList.contains('reading')) return;
    const line = mouseY ?? (r.top + r.height * .32);
    const cur = arts.find(a => { const b = a.getBoundingClientRect(); return b.top <= line && b.bottom > line; });
    if (!cur) return;
    if (cur.dataset.slot != null) setActive(-1, -1, +cur.dataset.slot, 'read');
    else setActive(+cur.dataset.f, +cur.dataset.s, -1, 'read');
  });
}, { passive: true });

/* ---------- pointer input on the model ---------- */
const tip = $('#tip');
let tipTimer = 0;
function showTip(info, cx, cy, ms){
  if (!info){ tip.classList.remove('show'); return; }
  tip.innerHTML = `<small>${esc(info.k)}</small>${esc(info.en)}`;
  tip.style.left = '0px'; tip.style.top = '0px';
  const r = stage.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = cx - r.left + 16, y = cy - r.top + 14;
  if (x + w > r.width - 10) x = cx - r.left - w - 16;
  x = clamp(x, 10, Math.max(10, r.width - w - 10)); y = clamp(y, 10, Math.max(10, r.height - h - 10));
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  tip.classList.add('show');
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(() => tip.classList.remove('show'), ms);
}
const pts = new Map(); let down = null, pinch = null, moved = false;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2){
    const [a, b] = [...pts.values()], r = stage.getBoundingClientRect(), f = ((a.y + b.y) / 2 - r.top) / r.height;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoomT };
    anchor = { f, y: ty + (.5 - f) * viewH() };
  }
  down = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = false; vel = 0; anim = null; tiltT = null;
  stopAuto();
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)){
    if (e.pointerType === 'mouse'){
      const info = pick(e.clientX, e.clientY);
      canvas.classList.toggle('pt', !!info);
      showTip(info, e.clientX, e.clientY);
      if (info && info.f != null) highlightModel(info.f, info.s); else if (info && info.slot != null) highlightModel(-1, -1, info.slot); else highlightModel(act.f, act.s, act.side);
    }
    return;
  }
  const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2 && pinch){
    const [a, b] = [...pts.values()];
    zoomT = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 1, 5); moved = true; return;
  }
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) moved = true;
  if (!moved) return;
  yaw += dx * .011; vel = dx * .011;
  if (zoom > 1.05){ ty = clampTy(ty + dy * viewH() / stage.clientHeight, zoom); tyT = ty; anchor = null; }
  else tilt = clamp(tilt + dy * .004, .06, .55);
  showTip(null);
});
function endPointer(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0 && !moved && down && performance.now() - down.t < 500){
    const info = pick(e.clientX, e.clientY);
    if (isWide()){
      if (info && info.f != null) openPassage(info.f, info.s);
      else if (info && info.slot != null) openSide(info.slot);
      else if (info) showTip(info, e.clientX, e.clientY, 2600);
    } else {
      if (info && info.f != null) setActive(info.f, info.s, -1, 'model');
      else if (info && info.slot != null) setActive(-1, -1, info.slot, 'model');
      else if (info) showTip(info, e.clientX, e.clientY, 2600);
      else setActive(-1, -1, -1, 'model');
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
document.addEventListener('touchmove', e => { if (!e.target.closest('#rs, #card, #aboutBox')) e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { if (!pts.size){ showTip(null); highlightModel(act.f, act.s, act.side); } });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); stopAuto();
  const r = stage.getBoundingClientRect(), f = (e.clientY - r.top) / r.height;
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  const rate = (e.ctrlKey || e.metaKey) ? .012 : .0022;        // ctrlKey = trackpad pinch
  if (!e.ctrlKey && !e.metaKey && zoomT > 1.02){   // zoomed in: scrolling moves along the obelisk
    tyT = clampTy(tyT - dy * viewH() / stage.clientHeight * .9, zoomT); anchor = null; return;
  }
  if (!e.ctrlKey && !e.metaKey && dy > 0) return; // full view: scrolling up zooms in, nothing to scroll down to
  anchor = { f, y: ty + (.5 - f) * viewH() };
  zoomT = clamp(zoomT * Math.exp(-clamp(dy, -120, 120) * rate), 1, 5);
}, { passive: false });
// back to the opening view: whole obelisk, default tilt, slow turn resumed
$('#fit').onclick = () => { zoomT = 1; tyT = HOME_Y; anchor = null; region = 'ob'; anim = null; vel = 0; tiltT = .2; auto = true; };
const stepZoom = k => { stopAuto(); const f = .5; anchor = { f, y: ty }; zoomT = clamp(zoomT * k, 1, 5); if (zoomT === 1) anchor = null, tyT = HOME_Y; };
$('#zin').onclick = () => stepZoom(1.6); $('#zout').onclick = () => stepZoom(1 / 1.6);

/* ---------- loop ---------- */
const faceCap = $('#faceCap'), fitBtn = $('#fit'), zinBtn = $('#zin'), zoutBtn = $('#zout');
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // zoom: exponential ease in log space so steps feel even at every scale
  const kz = 1 - Math.exp(-dt * (pinch ? 28 : 11));
  zoom = Math.exp(Math.log(zoom) + (Math.log(zoomT) - Math.log(zoom)) * kz);
  if (Math.abs(zoomT - zoom) < 5e-4) zoom = zoomT;
  if (anchor){
    ty = anchor.y - (.5 - anchor.f) * viewH();
    if (zoom === zoomT && !pinch){ tyT = ty; anchor = null; }
  } else ty += (tyT - ty) * (1 - Math.exp(-dt * 7));
  ty = clampTy(ty, zoom); tyT = clampTy(tyT, zoomT);
  if (tiltT != null){ tilt += (tiltT - tilt) * (1 - Math.exp(-dt * 6)); if (Math.abs(tiltT - tilt) < 1e-3){ tilt = tiltT; tiltT = null; } }
  if (anim){
    const k = 1 - Math.pow(.0012, dt), d = anim.yaw - yaw; yaw += d * k;
    if (Math.abs(d) < .002) anim = null;
  } else if (auto && !pts.size) yaw -= dt * .14;
  else if (!pts.size && Math.abs(vel) > 1e-4){ yaw += vel; vel *= .92; }
  place();
  renderer.render(scene, cam);
  const ff = frontFace(), lowView = zoom > 1.3 && ty < 7;
  faceCap.textContent = lowView ? `${U(SIDES[ff].k)} · ${U('pedN')}` : `${U('face')} ${R[ff]} · ${L(faces[ff].subtitle)}`;
  fitBtn.classList.toggle('show', zoom > 1.05);
  zinBtn.disabled = zoomT >= 4.99; zoutBtn.disabled = zoomT <= 1.001;
  requestAnimationFrame(loop);
}
applyUI(); renderRead();
requestAnimationFrame(loop);
$('#loader').style.opacity = 0; setTimeout(() => $('#loader').remove(), 450);
</script>
</body>
</html>
