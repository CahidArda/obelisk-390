<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Bosphore 1819 plate (dark ground, gold rule, mirrored scrollwork) carrying the
       wedjat, the Eye of Horus: brow, eye, the falcon cheek mark and the spiral. -->
  <defs>
    <g id="q">
      <path d="M32 32 C 26 30, 20 30, 14 34 C 10 37, 9 43, 13 46 C 16 48, 20 46, 19 42 C 18 39, 14 39, 14 42" fill="none" stroke="#c9a978" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M32 32 C 30 26, 30 20, 34 14 C 37 10, 43 9, 46 13 C 48 16, 46 20, 42 19 C 39 18, 39 14, 42 14" fill="none" stroke="#c9a978" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M12 12 C 16 13, 19 16, 20 20" fill="none" stroke="#b8864f" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="9" cy="9" r="1.3" fill="#b8864f"/>
      <circle cx="24" cy="10" r="0.9" fill="#b8864f"/>
      <circle cx="10" cy="24" r="0.9" fill="#b8864f"/>
    </g>
    <g id="eye" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 20.5 C 20 15.5, 36 13.5, 49.5 17"/>
      <path d="M13 31 C 19 23.5, 34 22, 46 27.5 C 39.5 33.5, 23 35.5, 13 31 Z"/>
      <path d="M46 27.5 L 52.5 27.5"/>
      <path d="M24 34 L 22.6 47.5"/>
      <path d="M33.5 34 C 34.5 39, 37 43.2, 41 43.8 C 44.2 44.3, 45.8 41.2, 43.8 39.4 C 42.2 38, 39.8 39.2, 40.8 41"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="12" fill="#1c1814"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="9" fill="none" stroke="#b8864f" stroke-width="1" opacity="0.9"/>
  <g opacity="0.8">
    <use href="#q"/>
    <use href="#q" transform="translate(64 0) scale(-1 1)"/>
    <use href="#q" transform="translate(0 64) scale(1 -1)"/>
    <use href="#q" transform="translate(64 64) scale(-1 -1)"/>
  </g>
  <!-- dark halo so the scrollwork stops short of the eye -->
  <use href="#eye" stroke="#1c1814" stroke-width="8" opacity="0.94"/>
  <path d="M13 31 C 19 23.5, 34 22, 46 27.5 C 39.5 33.5, 23 35.5, 13 31 Z" fill="#1c1814"/>
  <use href="#eye" stroke="#e2c58f" stroke-width="2.4"/>
  <circle cx="30.5" cy="28.6" r="4.1" fill="#e2c58f"/>
</svg>
