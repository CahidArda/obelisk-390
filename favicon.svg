<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Bosphore 1819 plate (dark ground, gold rule, mirrored scrollwork), with the obelisk
       standing in it as the app draws it: two flat granite faces, a faint column of signs,
       the marble pedestal. -->
  <defs>
    <g id="q">
      <path d="M32 32 C 26 30, 20 30, 14 34 C 10 37, 9 43, 13 46 C 16 48, 20 46, 19 42 C 18 39, 14 39, 14 42" fill="none" stroke="#c9a978" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M32 32 C 30 26, 30 20, 34 14 C 37 10, 43 9, 46 13 C 48 16, 46 20, 42 19 C 39 18, 39 14, 42 14" fill="none" stroke="#c9a978" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M12 12 C 16 13, 19 16, 20 20" fill="none" stroke="#b8864f" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="9" cy="9" r="1.3" fill="#b8864f"/>
      <circle cx="24" cy="10" r="0.9" fill="#b8864f"/>
      <circle cx="10" cy="24" r="0.9" fill="#b8864f"/>
    </g>
    <path id="ob" d="M25 46.5 L27.8 15 L32.6 7 L36.6 15 L39 46.5 H42.5 V51.5 H45.5 V56 H18.5 V51.5 H21.5 V46.5 Z"/>
  </defs>
  <rect width="64" height="64" rx="12" fill="#1c1814"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="9" fill="none" stroke="#b8864f" stroke-width="1" opacity="0.9"/>
  <g opacity="0.8">
    <use href="#q"/>
    <use href="#q" transform="translate(64 0) scale(-1 1)"/>
    <use href="#q" transform="translate(0 64) scale(1 -1)"/>
    <use href="#q" transform="translate(64 64) scale(-1 -1)"/>
  </g>
  <!-- dark halo so the scrollwork stops short of the stone -->
  <use href="#ob" fill="#1c1814" stroke="#1c1814" stroke-width="7" stroke-linejoin="round" opacity="0.92"/>
  <g stroke="#1c1814" stroke-width="1.2" stroke-linejoin="round">
    <path d="M21.5 46.5 H42.5 V51.5 H21.5 Z" fill="#e4ddcf"/>
    <path d="M18.5 51.5 H45.5 V56 H18.5 Z" fill="#d8cfbd"/>
    <path d="M25 46.5 L27.8 15 L34 15 L35.6 46.5 Z" fill="#d9a690"/>
    <path d="M35.6 46.5 L34 15 L36.6 15 L39 46.5 Z" fill="#b57f69"/>
    <path d="M27.8 15 L32.6 7 L34 15 Z" fill="#dfb19c"/>
    <path d="M34 15 L32.6 7 L36.6 15 Z" fill="#bd8873"/>
  </g>
  <g fill="#5a2c20" opacity="0.6">
    <rect x="29.2" y="19" width="2.8" height="1.1"/>
    <rect x="29.6" y="22.6" width="2" height="2.8" rx="1"/>
    <rect x="29.1" y="27.8" width="3" height="1.1"/>
    <rect x="29.4" y="31.2" width="2.4" height="2.3"/>
    <rect x="29" y="36" width="3.2" height="1.1"/>
    <rect x="29.5" y="39.4" width="2.2" height="2.9" rx="1"/>
  </g>
  <!-- a thin gold edge on the lit side of the shaft -->
  <path d="M25 46.5 L27.8 15 L32.6 7" fill="none" stroke="#c9a978" stroke-width="0.6" stroke-linejoin="round" opacity="0.7"/>
</svg>
